<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern To-Do List</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3 class="sidebar-title">
                <i class="bi bi-check2-square me-2"></i>
                To-Do List
            </h3>
            <button class="btn btn-sm btn-outline-secondary d-md-none" id="sidebarToggle">
                <i class="bi bi-x"></i>
            </button>
        </div>
        
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" href="#" data-section="dashboard">
                    <i class="bi bi-speedometer2 me-2"></i>
                    Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" data-section="tasks">
                    <i class="bi bi-list-task me-2"></i>
                    Tasks
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" data-section="history">
                    <i class="bi bi-clock-history me-2"></i>
                    History
                </a>
            </li>
        </ul>
        
        <div class="sidebar-footer">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="darkModeToggle">
                <label class="form-check-label" for="darkModeToggle">
                    <i class="bi bi-moon me-2"></i>
                    Dark Mode
                </label>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="header">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <button class="btn btn-outline-secondary d-md-none me-3" id="mobileSidebarToggle">
                        <i class="bi bi-list"></i>
                    </button>
                    <h1 class="h3 mb-0" id="pageTitle">Dashboard</h1>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" id="addTaskBtn">
                        <i class="bi bi-plus-lg me-2"></i>
                        Add Task
                    </button>
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-gear me-2"></i>
                            Options
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" id="exportTasks">
                                <i class="bi bi-download me-2"></i>Export Tasks
                            </a></li>
                            <li><a class="dropdown-item" href="#" id="importTasks">
                                <i class="bi bi-upload me-2"></i>Import Tasks
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="clearAllTasks">
                                <i class="bi bi-trash me-2"></i>Clear All Tasks
                            </a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </header>

        <!-- Dashboard Section -->
        <section id="dashboard-section" class="content-section">
            <div class="row g-4">
                <div class="col-md-3">
                    <div class="card stat-card">
                        <div class="card-body text-center">
                            <i class="bi bi-list-task stat-icon text-primary"></i>
                            <h3 class="stat-number" id="totalTasks">0</h3>
                            <p class="stat-label">Total Tasks</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card">
                        <div class="card-body text-center">
                            <i class="bi bi-play-circle stat-icon text-warning"></i>
                            <h3 class="stat-number" id="activeTasks">0</h3>
                            <p class="stat-label">Active</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card">
                        <div class="card-body text-center">
                            <i class="bi bi-hourglass-split stat-icon text-info"></i>
                            <h3 class="stat-number" id="inProgressTasks">0</h3>
                            <p class="stat-label">In Progress</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card">
                        <div class="card-body text-center">
                            <i class="bi bi-check-circle stat-icon text-success"></i>
                            <h3 class="stat-number" id="completedTasks">0</h3>
                            <p class="stat-label">Completed</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="row mt-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">Recent Tasks</h5>
                        </div>
                        <div class="card-body">
                            <div id="recentTasksList">
                                <!-- Recent tasks will be populated here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Tasks Section -->
        <section id="tasks-section" class="content-section d-none">
            <!-- Filter Controls -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex flex-wrap gap-2 align-items-center">
                                <span class="fw-semibold me-3">Filter:</span>
                                <div class="btn-group" role="group">
                                    <input type="radio" class="btn-check" name="filterStatus" id="filterAll" value="all" checked>
                                    <label class="btn btn-outline-primary" for="filterAll">All</label>
                                    
                                    <input type="radio" class="btn-check" name="filterStatus" id="filterActive" value="active">
                                    <label class="btn btn-outline-primary" for="filterActive">Active</label>
                                    
                                    <input type="radio" class="btn-check" name="filterStatus" id="filterInProgress" value="in-progress">
                                    <label class="btn btn-outline-primary" for="filterInProgress">In Progress</label>
                                    
                                    <input type="radio" class="btn-check" name="filterStatus" id="filterCompleted" value="completed">
                                    <label class="btn btn-outline-primary" for="filterCompleted">Completed</label>
                                </div>
                                <div class="ms-auto">
                                    <div class="input-group" style="max-width: 300px;">
                                        <span class="input-group-text">
                                            <i class="bi bi-search"></i>
                                        </span>
                                        <input type="text" class="form-control" id="searchTasks" placeholder="Search tasks...">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Task Columns -->
            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="card task-column">
                        <div class="card-header bg-primary text-white">
                            <h5 class="card-title mb-0">
                                <i class="bi bi-play-circle me-2"></i>
                                Active
                                <span class="badge bg-light text-primary ms-2" id="activeCount">0</span>
                            </h5>
                        </div>
                        <div class="card-body task-list" id="activeTasksList" data-status="active">
                            <!-- Active tasks will be populated here -->
                        </div>
                    </div>
                </div>
                
                <div class="col-lg-4">
                    <div class="card task-column">
                        <div class="card-header bg-warning text-white">
                            <h5 class="card-title mb-0">
                                <i class="bi bi-hourglass-split me-2"></i>
                                In Progress
                                <span class="badge bg-light text-warning ms-2" id="inProgressCount">0</span>
                            </h5>
                        </div>
                        <div class="card-body task-list" id="inProgressTasksList" data-status="in-progress">
                            <!-- In Progress tasks will be populated here -->
                        </div>
                    </div>
                </div>
                
                <div class="col-lg-4">
                    <div class="card task-column">
                        <div class="card-header bg-success text-white">
                            <h5 class="card-title mb-0">
                                <i class="bi bi-check-circle me-2"></i>
                                Completed
                                <span class="badge bg-light text-success ms-2" id="completedCount">0</span>
                            </h5>
                        </div>
                        <div class="card-body task-list" id="completedTasksList" data-status="completed">
                            <!-- Completed tasks will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- History Section -->
        <section id="history-section" class="content-section d-none">
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">Activity History</h5>
                        </div>
                        <div class="card-body">
                            <div id="historyList">
                                <!-- History entries will be populated here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Add/Edit Task Modal -->
    <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="taskModalLabel">Add New Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="taskForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="taskTitle" class="form-label">Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="taskTitle" required maxlength="100">
                            <div class="invalid-feedback"></div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="taskDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="taskDescription" rows="3" maxlength="500"></textarea>
                            <div class="invalid-feedback"></div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="taskDueDate" class="form-label">Due Date</label>
                                    <input type="date" class="form-control" id="taskDueDate">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="taskStatus" class="form-label">Status</label>
                                    <select class="form-select" id="taskStatus">
                                        <option value="active">Active</option>
                                        <option value="in-progress">In Progress</option>
                                        <option value="completed">Completed</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="saveTaskBtn">Save Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Task Details Modal -->
    <div class="modal fade" id="taskDetailsModal" tabindex="-1" aria-labelledby="taskDetailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="taskDetailsModalLabel">Task Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="taskDetailsContent">
                    <!-- Task details will be populated here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="editTaskFromDetails">Edit Task</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Import File Input (Hidden) -->
    <input type="file" id="importFileInput" accept=".json" style="display: none;">

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <i class="bi bi-check-circle-fill text-success me-2"></i>
                <strong class="me-auto">Success</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastMessage">
                <!-- Toast message will be populated here -->
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
